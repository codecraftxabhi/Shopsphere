spring:
  application:
    name: shopsphere
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopsphere}
    username: ${DB_USERNAME:shopsphere}
    password: ${DB_PASSWORD:shopsphere}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456789}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
server:
  port: ${PORT:8080}
